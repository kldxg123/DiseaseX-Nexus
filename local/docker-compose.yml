services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infectious_intel}
      POSTGRES_USER: ${POSTGRES_USER:-infectious_intel}
      POSTGRES_PASSWORD: "REDACTED"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local}
      MINIO_ROOT_PASSWORD: "REDACTED"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  api:
    build:
      context: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql://REDACTED@postgres:5432/infectious_intel
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio-local}
      MINIO_SECRET_KEY: "REDACTED"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CRAWLER_RESPECT_ROBOTS: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow

  worker:
    build:
      context: .
    command: python -m worker_agent.cli describe-schedule
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://REDACTED@postgres:5432/infectious_intel
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow

  dashboard:
    build:
      context: .
    command: streamlit run apps/dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mlflow-data:
