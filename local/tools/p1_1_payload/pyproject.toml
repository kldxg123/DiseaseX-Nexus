[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "epidemic-openclaw"
version = "1.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "SQLAlchemy==2.0.51", "alembic==1.18.5", "psycopg[binary]==3.3.4",
  "pydantic==2.13.4", "pydantic-settings==2.14.2", "pycountry==26.2.16",
]

[project.scripts]
epidemic-core = "epidemic_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires temporary PostgreSQL database"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["epidemic_core"]
mypy_path = "src"
