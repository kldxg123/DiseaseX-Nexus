stage: P2a
disease_scope: ebola_only
max_download_resources_per_query: 1
default_max_file_mb: 20
sources:
  who_don:
    source_name: WHO Disease Outbreak News
    source_type: label_source
    license_or_terms: WHO website terms; metadata review required
    urls:
      - https://www.who.int/emergencies/disease-outbreak-news
      - https://www.who.int/emergencies/disease-outbreak-news/item/2022-DON410
      - https://www.who.int/emergencies/disease-outbreak-news/item/2021-DON316
    role_hint: label_source_or_metadata
    allowed_use: event_table_construction
    max_file_mb: 5
  cdc_history:
    source_name: CDC Ebola outbreak history
    source_type: label_source
    license_or_terms: US CDC public website; metadata review required
    urls:
      - https://www.cdc.gov/ebola/outbreaks/index.html
      - https://www.cdc.gov/vhf/ebola/history/chronology.html
    role_hint: label_source_or_cross_check
    allowed_use: event_table_construction
    max_file_mb: 5
  ecdc:
    source_name: ECDC outbreak updates
    source_type: label_source
    license_or_terms: ECDC website terms; metadata review required
    urls:
      - https://www.ecdc.europa.eu/en/ebola-virus-disease
    role_hint: metadata
    allowed_use: source_discovery_cross_check
    max_file_mb: 5
  reliefweb_unicef:
    source_name: ReliefWeb and UNICEF situation reports
    source_type: label_source_or_metadata
    license_or_terms: ReliefWeb/UNICEF terms; metadata review required
    urls:
      - https://api.reliefweb.int/v1/reports?appname=aibola-p2a&query[value]=Uganda%20Ebola%202022&limit=10
    role_hint: metadata
    allowed_use: source_discovery_cross_check
    max_file_mb: 5
  hdx:
    source_name: HDX CKAN search
    source_type: dataset_search
    license_or_terms: per-resource HDX metadata
    search_terms:
      - Ebola cases
      - Ebola Uganda 2022
      - Ebola DRC health zone
      - Guinea Ebola 2021
    role_hint: dataset_candidate
    allowed_use: structured_dataset_if_semantics_pass
    max_file_mb: 20
  github:
    source_name: GitHub dataset search
    source_type: dataset_search
    license_or_terms: per-repository license
    search_terms:
      - Ebola DRC health zone cases
      - Uganda 2022 Ebola district cases
      - Ebola outbreak time series dataset
    role_hint: dataset_candidate
    allowed_use: structured_dataset_if_license_and_semantics_pass
    max_file_mb: 0
  gdelt:
    source_name: GDELT aggregate signal API
    source_type: osint_aggregate
    license_or_terms: GDELT terms; aggregate counts only
    url_template: "https://api.gdeltproject.org/api/v2/doc/doc?query={query}&mode=timelinevol&format=json&startdatetime={start}&enddatetime={end}"
    queries:
      - ebola
      - "ebola outbreak"
      - "hemorrhagic fever"
    role_hint: feature_candidate
    allowed_use: aggregate_pre_event_signal_counts_only
    max_file_mb: 5
  geoboundaries:
    source_name: geoBoundaries
    source_type: admin_boundary
    license_or_terms: gbOpen
    url_template: "https://www.geoboundaries.org/api/current/gbOpen/{iso3}/{adm}/"
    countries: [GIN, LBR, SLE, COD, UGA]
    admin_levels: [ADM1]
    role_hint: background_feature
    allowed_use: admin_matching_and_static_features
    max_file_mb: 20
  nasa_power:
    source_name: NASA POWER
    source_type: weather_api
    license_or_terms: NASA POWER open data
    url_template: "https://power.larc.nasa.gov/api/temporal/daily/point?parameters=PRECTOTCORR,T2M,RH2M&community=AG&longitude={lon}&latitude={lat}&start={start}&end={end}&format=JSON"
    role_hint: background_feature
    allowed_use: weather_feature_candidate
    max_file_mb: 5
  ourairports:
    source_name: OurAirports
    source_type: mobility_proxy
    license_or_terms: public domain / OurAirports terms
    urls:
      - https://davidmegginson.github.io/ourairports-data/airports.csv
    role_hint: background_feature
    allowed_use: airport_distance_count_proxy
    max_file_mb: 20
  geofabrik:
    source_name: Geofabrik OSM Africa extract
    source_type: mobility_proxy
    license_or_terms: OpenStreetMap ODbL; Geofabrik terms
    urls:
      - https://download.geofabrik.de/africa.html
    role_hint: metadata
    allowed_use: road_proxy_discovery_only
    max_file_mb: 5

