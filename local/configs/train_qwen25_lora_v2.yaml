      "lora_alpha": 32,
      "lora_dropout": 0.05,
      "learning_rate": 0.0001
    },
    "v2b_rebalance_plus_prompt_instruction": {
      "description": "Use qwen25_sft_train_v2_balanced.jsonl with up-recall instruction rewrites.",
      "lora_r": 32,
      "lora_alpha": 64,
      "lora_dropout": 0.05,
      "learning_rate": 0.0002
    }
